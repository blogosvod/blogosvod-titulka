
name: Aktualizovat titulku

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: python update.py

      - run: |
          git config user.name "BlogoSvod Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html status.json
          git diff --cached --quiet || (git commit -m "Aktualizace titulky" && git push)
